name: Verify Verilog

on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Run self-checking simulations
        run: make test
